  <div class="form-row">

  <div class="form-field">

<script src="js/catalogo.js?v=2"></script>
<script>
/* ============================================================================
 * Seleccion de ambiente (una sola pagina para PROD, UAT y preprod2)
 * ============================================================================
 * Sin parametro la pagina manda a PROD. Con ?env=uat o ?env=preprod2 manda al
 * sandbox y muestra un aviso arriba del formulario. Si el ambiente no existe o
 * le falta un dato, el envio se BLOQUEA a proposito (Web-to-Lead no avisa
 * cuando algo sale mal).
 * ========================================================================== */
(function () {
  var AMBIENTE_POR_DEFECTO = 'prod';
  var AMBIENTES = {
    prod: {
      nombre:   'PROD',
      host:     'https://deacero-2018.my.salesforce.com',
      oid:      '00D0b000000uX3F',
      campana:  '701Rp00000xkt2qIAA',   // "Sistemas Constructivos - Landing Generica"
      codigos:  {
        v7trs6: '701Rp00000yDT02IAG',
        '4pbrzt': '701Rp00000yDv4MIAS',
        rua5qj: '701Rp00000yDX5GIAW'
      },
      origen:   '00NRp0000071CWC',   // SPG_Origen_Landing__c
      cantidad: '00NRp0000071CWB',   // SPG_Cantidad__c
      segmento: '00NRp0000071CWD'    // SPG_Segmento__c
    },
    uat: {
      nombre:   'UAT',
      host:     'https://deacero-2018--uatpreprod.sandbox.my.salesforce.com',
      oid:      '00Dcb000001lLYP',
      campana:  '',
      codigos:  {},
      origen:   '',
      cantidad: '',
      segmento: ''
    },
    preprod2: {
      nombre:   'preprod2',
      host:     'https://deacero-2018--preprod2.sandbox.my.salesforce.com',
      oid:      '00Dcb00000EycJY',
      campana:  '701cb000012Q8oRAAS',
      codigos:  {
        v7trs6: '701cb00001Mvsg1AAB',
        '4pbrzt': '701cb00001MtCCDAA3',
        rua5qj: '701cb00001MqqzbAAB'
      },
      origen:   '00Ncb00000lHGkF',
      cantidad: '00Ncb00000c0HEx',
      segmento: '00Ncb00000c0HEy'
    }
  };
  /* Codigo de QR (?r=): se traduce a su campana hija; sin codigo o con uno
   * desconocido cae en la campana padre. Ver documentacion/QR_Campanas_Alambres.md. */
  function campanaPorCodigo(amb) {
    var codigo = '';
    try {
      var params = new URLSearchParams(window.location.search);
      codigo = (params.get('r') || '').toLowerCase();
      if (codigo) {
        try { sessionStorage.setItem('landing_r', codigo); } catch (e) { /* sin storage: solo esta carga */ }
        params.delete('r');
        var resto = params.toString();
        history.replaceState(null, '', window.location.pathname + (resto ? '?' + resto : '') + window.location.hash);
      } else {
        try { codigo = sessionStorage.getItem('landing_r') || ''; } catch (e) { codigo = ''; }
      }
    } catch (e) {
      codigo = '';
    }
    var codigos = amb.codigos || {};
    return Object.prototype.hasOwnProperty.call(codigos, codigo) ? codigos[codigo] : amb.campana;
  }

  var form = document.getElementById('deacero-lead-form');
  if (!form) {
    return;
  }
  var clave = AMBIENTE_POR_DEFECTO;
  try {
    clave = (new URLSearchParams(window.location.search).get('env') || AMBIENTE_POR_DEFECTO).toLowerCase();
  } catch (e) {
    clave = AMBIENTE_POR_DEFECTO;
  }
  var amb = AMBIENTES[clave];
  var faltantes = [];
  if (!amb) {
    faltantes.push('el ambiente "' + clave + '" no existe (usa prod, uat o preprod2)');
  } else {
    ['host', 'oid', 'campana', 'origen', 'cantidad', 'segmento'].forEach(function (k) {
      if (!amb[k]) { faltantes.push(k); }
    });
  }
  if (faltantes.length) {
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      window.alert('El formulario no esta disponible en este momento. Intenta mas tarde.');
    });
    if (window.console) {
      console.error('[landing] Envio bloqueado. Configuracion incompleta: ' + faltantes.join(', '));
    }
    return;
  }
  form.action = amb.host + '/servlet/servlet.WebToLead?encoding=UTF-8';
  document.getElementById('w2l_oid').value      = amb.oid;
  document.getElementById('w2l_campaign').value = campanaPorCodigo(amb);
  document.getElementById('w2l_origen').name    = amb.origen;
  document.getElementById('spg_cantidad').name  = amb.cantidad;
  document.getElementById('spg_segmento_hidden').name = amb.segmento;
  if (clave !== 'prod') {
    var aviso = document.createElement('div');
    aviso.className = 'aviso-ambiente';
    aviso.textContent = 'AMBIENTE DE PRUEBAS: este formulario envía a ' + amb.nombre + ', no a producción.';
    aviso.setAttribute('role', 'status');
    form.insertBefore(aviso, form.firstChild);
  }
})();
</script>
